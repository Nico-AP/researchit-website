{% with biz=settings.researchit_website.BusinessSettings %}
<section id="contact">
  <div class="container">
    <h2 class="section-label">Contact</h2>
    {% if page.contact_text %}
    <p class="hero-sub contact-text mb-4">{{ page.contact_text }}</p>
    {% endif %}
    <div class="d-flex flex-wrap gap-3 fade-up">
      {% if biz.contact_email %}
      <a class="contact-chip" href="mailto:{{ biz.contact_email }}">
        <i class="bi bi-envelope" aria-hidden="true"></i>
        {{ biz.contact_email }}
      </a>
      {% endif %}

      {% if biz.github_url %}
      <a class="contact-chip" href="{{ biz.github_url }}" target="_blank" rel="noopener">
        <i class="bi bi-github" aria-hidden="true"></i>
        GitHub
      </a>
      {% endif %}
    </div>
  </div>
</section>
{% endwith %}
