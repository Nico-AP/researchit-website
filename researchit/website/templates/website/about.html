{% load wagtailcore_tags %}

<section id="about">
  <div class="container">
    <h2 class="section-label">About</h2>
    <div class="row g-5 align-items-start">

      <div class="col-md-6 fade-up about-text">
        {{ page.about_text|richtext }}
        {% if page.about_availability %}
        <p class="about-availability">{{ page.about_availability }}</p>
        {% endif %}
      </div>

      {% if page.facts.all %}
      <div class="col-md-6 fade-up">
        <dl class="meta-card">
          {% for fact in page.facts.all %}
          <div class="meta-row">
            <dt class="meta-key">{{ fact.label }}</dt>
            <dd class="meta-val">{{ fact.value }}</dd>
          </div>
          {% endfor %}
        </dl>
      </div>
      {% endif %}

    </div>
  </div>
</section>

<hr class="section-sep" />
