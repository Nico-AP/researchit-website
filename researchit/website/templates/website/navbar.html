{% with biz=settings.researchit_website.BusinessSettings %}
<nav class="navbar navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <div class="brand-icon"></div>
      Pfiffner Research it
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1 mb-2 mb-md-0">
        <li class="nav-item"><a class="nav-link" href="/#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
        {% if biz.contact_email %}
        <li class="nav-item ms-md-3 mt-2 mt-md-0">
          <a class="btn-nav-cta" href="mailto:{{ biz.contact_email }}">{{ page.specific.cta_label|default:"Get in touch" }}</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
