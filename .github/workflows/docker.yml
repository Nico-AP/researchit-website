# Builds the production image and pushes it to ghcr.io/nico-ap/researchit-website.
# Runs only for release tags:  tag v1.2.3 -> :1.2.3, :1.2
# The image is checked (deploy checks, tests, smoke render) before it is pushed;
# if a check fails, nothing is pushed. Pin the version in researchit-deploy
# (group_data/all.py -> images["web"]), then run `just update web` there.
name: docker

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: researchit-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the build if production settings don't pass Django's deploy checks.
      - name: Django deploy checks
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_ALLOWED_HOSTS=example.com \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            researchit-website:ci python manage.py check --deploy --fail-level WARNING

      # Unit tests, run inside the built image (fresh DB: also exercises all migrations).
      - name: Tests
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_ALLOWED_HOSTS=testserver \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            researchit-website:ci python manage.py test

      # Render pages with production settings: catches e.g. templates that
      # reference static files missing from the manifest (which would be a 500).
      - name: Smoke-render pages
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_ALLOWED_HOSTS=testserver \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            researchit-website:ci sh -c 'python manage.py migrate -v0 && python -c "
          import django; django.setup()
          from django.test import Client
          for path in [\"/\", \"/cms/login/\"]:
              r = Client().get(path, secure=True)
              assert r.status_code == 200, (path, r.status_code)
              print(path, r.status_code)
          "'

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Delete untagged layers left behind in ghcr.io, and old non-release images
  # (:main / :sha-... from before this workflow ran only on tags; the 3 newest are
  # kept). Release images (1.2.3, 1.2) are never deleted, so any version pinned in
  # researchit-deploy stays pullable.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: researchit-website
          keep-n-tagged: 3
          delete-untagged: true
          exclude-tags: '^\d+\.\d+(\.\d+)?$'
          use-regex: true
