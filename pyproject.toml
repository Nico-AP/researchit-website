[project]
name = "researchit-website"
version = "0.1.0"
description = "Pfiffner Research IT website"
requires-python = ">=3.12,<3.13"
# Runtime dependencies (everything the production image needs).
dependencies = [
    "argon2-cffi==25.1.0",         # https://github.com/hynek/argon2_cffi
    "django==5.2.19",              # stay with 5.2.x - LTS until 2028
    "django-csp==4.0",             # https://django-csp.readthedocs.io/
    "django-otp==1.7.5",
    "django-structlog==10.0.0",    # https://github.com/jrobichaud/django-structlog
    "environs[django]==14.5.0",    # https://pypi.org/project/environs/
    "gunicorn==25.0.3",            # https://github.com/benoitc/gunicorn
    "psycopg[binary]==3.3.2",      # https://www.psycopg.org/psycopg3/
    "qrcode==8.2",
    "wagtail==8.1",
    "whitenoise[brotli]==6.12.0",  # https://github.com/evansd/whitenoise
]

[dependency-groups]
# Installed by `uv sync` by default; excluded from the image (`--no-dev`).
dev = [
    "coverage==7.13.3",
    "django-coverage-plugin==3.2.0",
    "django-debug-toolbar==6.2.0",
    "djlint==1.36.4",
    "mypy==1.19.1",
    "pip-audit==2.10.0",
    "pre-commit==4.5.1",
    "ruff==0.15.0",
]

[tool.uv]
package = false  # a Django site, not an installable package

# ==== Coverage ====
[tool.coverage.run]
include = ["researchit/**"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*"
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 80

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
# D018: links to "/" and "/#section" are fine - pages are routed by Wagtail, not {% url %}.
ignore = "D018,H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "UP038", # Checks for uses of isinstance/issubclass that take a tuple
          # of types for comparison.
          # Deactivated because it can make the code slow:
          # https://github.com/astral-sh/ruff/issues/7871
  "FBT001",
  "COM812",
]
# The fixes in extend-unsafe-fixes will require
# provide the `--unsafe-fixes` flag when fixing.
extend-unsafe-fixes = [
  "UP038",
]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["SLF001", "PLR2004", "FBT003", "PT009", "S106", "PT027", "S105"]
