exclude: '^docs/|/migrations/|devcontainer.json'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.33.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '5.2']

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.24
    hooks:
      - id: uv-lock

  # Audit the locked production dependencies for known vulnerabilities.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (locked production deps)
        stages: [pre-push]
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        entry: >-
          sh -c 'uv export --frozen --no-dev --no-emit-project --format requirements-txt
          | uv run --frozen pip-audit --disable-pip --require-hashes -r /dev/stdin'

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.49.10
    hooks:
      # - id: djlint-reformat-django
      - id: djlint-django

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
